name: Build firmware

# Produces the single-file binary that the web installer and the flash scripts
# both use, so nobody has to install a toolchain to put this on a board.
#
#   every push   -> firmware.bin as a downloadable artifact
#   merge to main -> a version tag (tools/next_version.py), a GitHub Release
#                    with the binary attached, and the web installer published
#                    to GitHub Pages - all without anyone typing a number
#   a hand-pushed tag still releases, for the rare deliberate re-cut
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Action versions are pinned to major tags that run on Node 24. GitHub is
# removing Node 20 from the runners, and until then anything still targeting it
# is force-run on Node 24 with a deprecation warning. actions/configure-pages,
# upload-pages-artifact and deploy-pages are left on their current tags: GitHub
# publishes the Node 24 update onto those major tags directly.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # design/logic.json is a specification, not a picture: the pressure outlook
  # bands and body-effect thresholds. This compiles the firmware's pure
  # implementation with the host compiler and checks it against the JSON.
  logic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check pressure logic against design/logic.json
        run: python3 tools/check_pressure_logic.py

  # Every merge to main gets a version tag, decided by tools/next_version.py
  # from the commits since the last one ([major] / [minor] in a message, else
  # patch). Pushed with the workflow's own token, which is allowed to write
  # refs; a tag pushed that way does not trigger a second run, so the build
  # job below is the one that ships it. Serialised so two quick merges cannot
  # both claim the same number.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the next version
        id: next
        run: |
          next="$(python3 tools/next_version.py)"
          if [[ -z "$next" ]]; then
            echo "HEAD is already tagged; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$next" -m "v$next"
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "tagged v$next"

  build:
    needs: [version]
    # The version job only runs on main; PR and tag builds must not wait on it.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history: the version is `git describe --tags`, which needs the
      # tags (including the one the job above just pushed) and the commits
      # back to the last one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Build
        working-directory: firmware
        run: pio run

      # The same string the firmware was just built with (tools/version.py
      # runs inside `pio run` too), so the installer page, the release and
      # the panel's own footer never disagree.
      - name: Determine version
        id: version
        run: echo "version=$(python3 tools/version.py)" >> "$GITHUB_OUTPUT"

      # One file, flashed at offset 0. Splitting bootloader / partition table /
      # app across three offsets is the single most common way an install goes
      # wrong, and there is no reason to make anyone deal with it.
      - name: Merge into a single flashable image
        working-directory: firmware
        run: |
          BUILD=.pio/build/airstream-weather
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
                        -name boot_app0.bin | head -1)
          mkdir -p ../dist
          esptool.py --chip esp32s3 merge_bin \
            -o ../dist/airstream-weather.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0000   $BUILD/bootloader.bin \
            0x8000   $BUILD/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  $BUILD/firmware.bin
          ls -la ../dist

      - uses: actions/upload-artifact@v6
        with:
          name: airstream-weather-firmware
          path: dist/airstream-weather.bin

      - name: Assemble the web installer
        run: |
          mkdir -p site
          cp tools/web-installer/index.html site/
          cp dist/airstream-weather.bin site/
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/" \
            tools/web-installer/manifest.json > site/manifest.json

      # configure-pages provisions the Pages site and resolves its URL. Without
      # it, deploy-pages has no site to deploy into and fails in a couple of
      # seconds, long before it touches the artifact.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          path: site

      # A release for every version: the one the version job just tagged on a
      # merge to main, or a tag pushed by hand. tools/flash.sh downloads the
      # latest of these.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/airstream-weather.bin
          generate_release_notes: true

  # The `if:` below is what restricts deployments to main and tags. The
  # github-pages environment may also carry its own deployment branch rule,
  # pinned to whatever the default branch was when the environment was first
  # created - and that rule is NOT updated when the default branch changes. A
  # deploy refused by it fails in about two seconds having run no steps at all,
  # while the build job above stays green. See docs/INSTALL.md.
  deploy-pages:
    needs: build
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages allows one deployment at a time. Scoped to this job so ordinary PR
    # builds are not serialized behind it.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
