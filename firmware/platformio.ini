; Airstream Weather Panel - LilyGO T-Display-S3-Long
;
;   pio run                 build
;   pio run -t upload       build + flash over USB
;   pio run -t monitor      serial console
;   pio run -t upload -t monitor
;
; See ../docs/INSTALL.md if you would rather flash a prebuilt binary and never
; install a toolchain at all.

[platformio]
default_envs = airstream-weather
boards_dir = boards

[env:airstream-weather]
platform  = espressif32 @ 6.5.0
board     = lilygo-t-display-s3-long
framework = arduino

; The version shown on the System screen comes from `git describe` at build
; time, injected as FIRMWARE_VERSION. See tools/version.py; nothing is bumped
; by hand, and a tag is a release.
extra_scripts = pre:../tools/version.py

board_build.partitions = default_16MB.csv

build_flags =
    ; ---- LVGL wiring -------------------------------------------------------
    ; lv_conf.h lives in include/, which PlatformIO puts on the include path.
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    ; ---- USB CDC on boot, so Serial works over the single USB-C port -------
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; ---- PSRAM (8MB) -------------------------------------------------------
    -D BOARD_HAS_PSRAM
    ; ---- Stack for the Arduino loop task ------------------------------------
    ; LVGL renders on this task, and the screen updates put a ~1.8KB weather
    ; snapshot on the same stack. The 8KB default leaves less headroom than is
    ; comfortable for something that has to run for months on a bulkhead.
    -D ARDUINO_LOOP_STACK_SIZE=12288
    ; ---- Trim the binary ---------------------------------------------------
    -D CORE_DEBUG_LEVEL=1
    ; ArduinoJson 7 leaves deprecated APIs in by default; we use none of them.
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1

build_unflags =
    -std=gnu++11
build_src_flags =
    -std=gnu++17

lib_deps =
    lvgl/lvgl @ ^8.4.0
    bblanchon/ArduinoJson @ ^7.1.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600
